# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - siyuanToken
    properties:
      siyuanToken:
        type: string
        description: SiYuan API token (found in Settings -> About in SiYuan Note)
      siyuanApiUrl:
        type: string
        default: http://localhost:6806
        description: SiYuan API endpoint URL
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/server-stdio.js'],
      env: {
        SIYUAN_TOKEN: config.siyuanToken,
        SIYUAN_API_URL: config.siyuanApiUrl || 'http://localhost:6806'
      }
    })
  exampleConfig:
    siyuanToken: your-siyuan-token-here
    siyuanApiUrl: http://localhost:6806
